<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="CWA Help Desk Appointment Form">
    <meta name="keywords" content="CWA, Help Desk, Appointment, HTML Form">
    <meta name="author" content="Abdulrahman Shehada">
    <title>CWA Help Desk Appointment</title>
</head>

<body>

    <a href="http://www.swin.edu.au/">
        <img src="images/logo.png"
             alt="Swinburne University of Technology logo">
    </a>

    <h1>CWA Help Desk Appointment</h1>

    <p>
        The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday.
    </p>

    <p>
        Check Blackboard for when CWA tutors will be there.
    </p>

    <form method="post"
          action="http://mercury.swin.edu.au/it000000/formtest.php">

        <fieldset>

            <legend>Student details</legend>

            <p>
                <label for="studentid">Student ID</label>

                <input
                    type="text"
                    id="studentid"
                    name="studentid"
                    pattern="[0-9]{7,10}"
                    required>
            </p>

            <p>
                <label for="givenname">Given Name</label>

                <input
                    type="text"
                    id="givenname"
                    name="givenname"
                    maxlength="15"
                    pattern="[A-Za-z]+"
                    required>

                <label for="familyname">Family Name</label>

                <input
                    type="text"
                    id="familyname"
                    name="familyname"
                    maxlength="15"
                    pattern="[A-Za-z]+"
                    required>
            </p>

        </fieldset>

        <fieldset>

            <legend>Your unit</legend>

            <p>
                <input
                    type="radio"
                    id="cos10011"
                    name="unit"
                    value="COS10011"
                    required>

                <label for="cos10011">COS10011</label>

                <input
                    type="radio"
                    id="cos60004"
                    name="unit"
                    value="COS60004">

                <label for="cos60004">COS60004</label>

                <input
                    type="radio"
                    id="cos60007"
                    name="unit"
                    value="COS60007">

                <label for="cos60007">COS60007</label>
            </p>

            <p>
                <label for="tutor">Your Tutor</label>

                <select id="tutor" name="tutor" required>
                    <option value="">Please Select</option>
                    <option value="abdullah">Abdullah</option>
                    <option value="hamad">Hamad</option>
                    <option value="khaled">Khaled</option>
                    <option value="noor">Noor</option>
                </select>
            </p>

        </fieldset>

        <fieldset>

            <legend>Issue</legend>

            <p>
                <label for="html">HTML</label>
                <input
                    type="checkbox"
                    id="html"
                    name="issue[]"
                    value="HTML"
                    checked>

                <label for="css">CSS</label>
                <input
                    type="checkbox"
                    id="css"
                    name="issue[]"
                    value="CSS">

                <label for="javascript">JavaScript</label>
                <input
                    type="checkbox"
                    id="javascript"
                    name="issue[]"
                    value="JavaScript">

                <label for="php">PHP</label>
                <input
                    type="checkbox"
                    id="php"
                    name="issue[]"
                    value="PHP">

                <label for="mysql">MySQL</label>
                <input
                    type="checkbox"
                    id="mysql"
                    name="issue[]"
                    value="MySQL">
            </p>

            <p>
                <label for="description">Description of Issue</label>
                <br>

                <textarea
                    id="description"
                    name="description"
                    rows="4"
                    cols="40"
                    placeholder="Write description of your problem here..."></textarea>
            </p>

        </fieldset>

        <fieldset>

            <legend>Preferred Date / Time</legend>

            <p>
                <label for="date">Date</label>

                <input
                    type="text"
                    id="date"
                    name="date"
                    placeholder="dd/mm/yyyy"
                    pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}"
                    required>
            </p>

            <p>
                <label for="time">Time</label>

                <input
                    type="text"
                    id="time"
                    name="time"
                    placeholder="00:00"
                    pattern="[0-9]{2}:[0-9]{2}"
                    required>
            </p>

        </fieldset>

        <p>
            <input type="submit" name="submit" value="Book">
            <input type="reset" name="reset" value="Reset form">
        </p>

    </form>

</body>

</html>
